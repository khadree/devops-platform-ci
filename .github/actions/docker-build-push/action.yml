name: Docker Build and Push to ECR
description: Builds a Docker image, tags it with the commit SHA, and pushes to AWS ECR
  Composite action that builds a Docker image tagged with the commit SHA,
  runs Gate 4 (Trivy image CVE scan) and Gate 5 (Syft SBOM generation),
  then pushes to AWS ECR only if both gates pass.
  Reusable across all services — no duplicated build logic.

inputs:
  service-name:
    description: Name of the ECR repository / service
    required: true
  aws-region:
    description: AWS region
    required: true
  aws-access-key-id:
    description: AWS access key ID
    required: true
  aws-secret-access-key:
    description: AWS secret access key
    required: true
  trivy-severity:
    description: "Comma-separated severity levels that fail the image scan"
    required: false
    default: "CRITICAL,HIGH"

outputs:
  image-uri:
    description: Full URI of the pushed image
    value: ${{ steps.build-push.outputs.image-uri }}

runs:
  using: composite
  steps:
      # ── Step 1: Set up Docker Buildx ─────────────────────────────────────────
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ inputs.aws-access-key-id }}
        aws-secret-access-key: ${{ inputs.aws-secret-access-key }}
        aws-region: ${{ inputs.aws-region }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    # ── Step 4: Compute and export image URI ──────────────────────────────────
    - name: Set image metadata
      id: meta
      shell: bash
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: ${{ inputs.service-name }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
        echo "image-uri=${IMAGE_URI}"       >> "$GITHUB_OUTPUT"
        echo "IMAGE_URI=${IMAGE_URI}"       >> "$GITHUB_ENV"
        echo "ECR_REGISTRY=${ECR_REGISTRY}" >> "$GITHUB_ENV"
        echo "ECR_REPOSITORY=${ECR_REPOSITORY}" >> "$GITHUB_ENV"
        echo "IMAGE_TAG=${IMAGE_TAG}"       >> "$GITHUB_ENV"
        echo "Target image URI: ${IMAGE_URI}"

   # ── Step 5: Build Docker image locally ────────────────────────────────────
    - name: Build Docker image
      shell: bash
      run: |
        docker build \
          --label "org.opencontainers.image.revision=${IMAGE_TAG}" \
          --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
          --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          -t "${IMAGE_URI}" \
          -t "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest" \
          .
        echo "Image successfully built locally: ${IMAGE_URI}"

# ── GATE 4: Trivy image scan ──────────────────────────────────────────────
    - name: "[Gate 4] Trivy — image CVE scan"
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ env.IMAGE_URI }}
        format: "table"
        exit-code: "1"
        ignore-unfixed: true
        severity: ${{ inputs.trivy-severity }}
        output: "trivy-image-results.txt"

    - name: Upload Trivy image scan results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: trivy-image-${{ inputs.service-name }}-${{ github.sha }}
        path: trivy-image-results.txt
        retention-days: 30

  # ── GATE 5: Syft SBOM generation ─────────────────────────────────────────
    - name: "[Gate 5] Syft — generate SBOM"
      uses: anchore/sbom-action@v0
      with:
        image: ${{ env.IMAGE_URI }}
        artifact-name: sbom-${{ inputs.service-name }}-${{ github.sha }}.spdx.json
        output-file: "sbom.spdx.json"
        format: "spdx-json"


     # ── Push to ECR ───────────────────────────────────────────────────────────
    # Only reached if BOTH Gate 4 and Gate 5 pass.
    - name: Push image to ECR
      shell: bash
      run: |
        docker push "${IMAGE_URI}"
        docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"
        echo "Successfully pushed to ECR: ${IMAGE_URI}"

  