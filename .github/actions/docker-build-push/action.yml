name: "Docker Build, Scan, and Push to ECR"

# are not valid for this field and cause the action to fail to parse.
description: "Builds a Docker image tagged with commit SHA, runs Gate 4 (Trivy image scan) and Gate 5 (Syft SBOM), then pushes to AWS ECR only if both gates pass."

inputs:
  service-name:
    description: "ECR repository name — must match exactly, no slashes"
    required: true
  aws-region:
    description: "AWS region (e.g. us-east-1)"
    required: true
  aws-access-key-id:
    description: "AWS IAM access key ID"
    required: true
  aws-secret-access-key:
    description: "AWS IAM secret access key"
    required: true
  trivy-severity:
    description: "Comma-separated severity levels that fail the image scan"
    required: false
    default: "CRITICAL,HIGH"

outputs:
  image-uri:
    description: "Full URI of the pushed image — registry/repo:sha"
    value: ${{ steps.meta.outputs.image-uri }}

runs:
  using: "composite"
  steps:

    # ── Set up Docker Buildx ──────────────────────────────────────────────────
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # ── Authenticate to AWS ───────────────────────────────────────────────────
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ inputs.aws-access-key-id }}
        aws-secret-access-key: ${{ inputs.aws-secret-access-key }}
        aws-region: ${{ inputs.aws-region }}

    # ── Log in to ECR ─────────────────────────────────────────────────────────
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    # ── Compute and export image URI ──────────────────────────────────────────
    # Writes the full image URI to GITHUB_OUTPUT (for the job-level output)
    # and to GITHUB_ENV (so all following steps in this action can use it).
    - name: Set image metadata
      id: meta
      shell: bash
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: ${{ inputs.service-name }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
        echo "image-uri=${IMAGE_URI}"               >> "$GITHUB_OUTPUT"
        echo "IMAGE_URI=${IMAGE_URI}"               >> "$GITHUB_ENV"
        echo "ECR_REGISTRY=${ECR_REGISTRY}"         >> "$GITHUB_ENV"
        echo "ECR_REPOSITORY=${ECR_REPOSITORY}"     >> "$GITHUB_ENV"
        echo "IMAGE_TAG=${IMAGE_TAG}"               >> "$GITHUB_ENV"
        echo "Target image URI: ${IMAGE_URI}"

    # ── Build Docker image (local only, not yet pushed) ───────────────────────
    # Tagged with both the commit SHA (immutable, used in k8s manifests)
    # and `latest` (convenience pointer — pushed alongside SHA tag).
    - name: Build Docker image
      shell: bash
      run: |
        docker build \
          --label "org.opencontainers.image.revision=${IMAGE_TAG}" \
          --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
          --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          -t "${IMAGE_URI}" \
          -t "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest" \
          .
        echo "Image built locally: ${IMAGE_URI}"

    # ── GATE 4: Trivy image scan ──────────────────────────────────────────────
    # Scans the built image for OS and library CVEs.
    # exit-code: "1" means the pipeline fails (and push is skipped) if any
    # CVE matching the severity threshold is found.
    - name: "[Gate 4] Trivy — image CVE scan"
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ env.IMAGE_URI }}
        format: "table"
        exit-code: "1"
        ignore-unfixed: true
        severity: ${{ inputs.trivy-severity }}
        output: "trivy-image-results.txt"

    - name: Print Trivy image scan results to logs
      if: always()
      shell: bash
      run: cat trivy-image-results.txt

    - name: Upload Trivy image scan results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: trivy-image-${{ inputs.service-name }}-${{ github.sha }}
        path: trivy-image-results.txt
        retention-days: 30

    # ── GATE 5: Syft SBOM generation ─────────────────────────────────────────
    # Generates a Software Bill of Materials (SPDX-JSON) listing every package
    # in the image. Uploaded as a GitHub Actions artifact (90-day retention).
    # FIX 5 (continued): Same indentation fix applied here.
    - name: "[Gate 5] Syft — generate SBOM"
      uses: anchore/sbom-action@v0
      with:
        image: ${{ env.IMAGE_URI }}
        artifact-name: sbom-${{ inputs.service-name }}-${{ github.sha }}.spdx.json
        output-file: "sbom.spdx.json"
        format: "spdx-json"

    # ── Push to ECR ───────────────────────────────────────────────────────────
    # Only reached if Gate 4 (Trivy image) AND Gate 5 (Syft) both passed.
    # Pushes the SHA tag (immutable) and latest tag (convenience).
    - name: Push image to ECR
      shell: bash
      run: |
        docker push "${IMAGE_URI}"
        echo "Pushed: ${IMAGE_URI}"
   #     echo "Pushed: ${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"
        # docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"
        # echo "Pushed: ${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"