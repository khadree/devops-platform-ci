name: Centralized CI/CD Workflow

on:
  workflow_call:                        # ← This makes it reusable
    inputs:
      service-name:
        required: true
        type: string
      eks-deployment-name:
        required: false
        type: string
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      AWS_REGION:
        required: true
      EKS_CLUSTER_NAME:
        required: false

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: rider-runner-kadiri              # ← Runs on your K8s pod runner
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js           # Adjust for your language
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: |
          if npm run | grep -q "lint"; then
            npm run lint
          else
            echo "No lint script found, skipping..."
          fi

      - name: Run tests
        run: |
          if npm run | grep -q "test"; then
            npm test
          else
            echo "No test script found, skipping..."
          fi

  build-and-push:
    name: Build and Push Image
    runs-on: rider-runner-kadiri
    needs: lint-and-test               # ← Only runs if tests pass
    outputs:
      image-uri: ${{ steps.docker.outputs.image-uri }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and push Docker image
        id: docker
        uses:  khadree/devops-platform-ci/.github/actions/docker-build-push@main
        with:
          service-name: ${{ inputs.service-name }}
          aws-region: ${{ secrets.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

