name: Centralized CI/CD Workflow

# ─────────────────────────────────────────────────────────────────────────────
# REUSABLE WORKFLOW — called by every service repo via `workflow_call`.
#
# Five mandatory security gates:
#   Gate 1 · Gitleaks     — secrets in git history
#   Gate 2 · CodeQL       — static code vulnerability analysis
#   Gate 3 · Trivy fs     — CVEs in dependencies BEFORE build
#   Gate 4 · Trivy image  — CVEs in the final built image  (inside composite action)
#   Gate 5 · Syft         — SBOM generation                (inside composite action)
#
# ECR push only happens after ALL gates pass.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_call:
    inputs:
      service-name:
        description: "ECR repository name — no slashes, e.g. trip-service"
        required: true
        type: string
      eks-deployment-name:
        description: "Kubernetes Deployment name for rollout verification"
        required: false
        type: string
      language:
        description: "CodeQL language: javascript, python, java, go, ruby, cpp"
        required: false
        type: string
        default: "javascript"
      trivy-severity:
        description: "Comma-separated severity levels that fail Trivy scans"
        required: false
        type: string
        default: "CRITICAL,HIGH"
      deploy:
        description: "Whether to run the deploy job after a successful build"
        required: false
        type: boolean
        default: true

    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      AWS_REGION:
        required: true
      EKS_CLUSTER_NAME:
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ══════════════════════════════════════════════════════════════════════════
  # GATE 1 — Gitleaks
  # fetch-depth: 0 gives full git history so no commit is skipped.
  # ══════════════════════════════════════════════════════════════════════════
  gitleaks:
    name: "[Gate 1] Gitleaks — secret detection"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # GATE 2 — CodeQL
  # Needs Gate 1 only — runs in parallel with Gate 3 and lint-and-test.
  # codeql:
  #   name: "[Gate 2] CodeQL — static analysis"
  #   runs-on: ubuntu-latest
  #   needs: gitleaks
  #   permissions:
  #     security-events: write
  #     actions: read
  #     contents: read
  #   steps:
  #     - name: Checkout code
  #       uses: actions/checkout@v4

  #     - name: Initialize CodeQL
  #       uses: github/codeql-action/init@v3
  #       with:
  #         languages: ${{ inputs.language }}
  #         queries: security-and-quality

  #     - name: Autobuild
  #       uses: github/codeql-action/autobuild@v3

  #     - name: Run CodeQL analysis
  #       uses: github/codeql-action/analyze@v3
  #       with:
  #         category: "/language:${{ inputs.language }}"

  # GATE 3 — Trivy filesystem scan

  trivy-fs:
    name: "[Gate 3] Trivy fs — filesystem CVE scan"
    runs-on: ubuntu-latest
    needs: gitleaks
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          severity: ${{ inputs.trivy-severity }}
          output: "trivy-fs-results.txt"

      - name: Print Trivy scan results to logs
        if: always()
        run: cat trivy-fs-results.txt

      - name: Upload Trivy fs scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-fs-${{ inputs.service-name }}-${{ github.sha }}
          path: trivy-fs-results.txt
          retention-days: 30

  # ══════════════════════════════════════════════════════════════════════════
  # Lint and test — also runs in parallel after Gate 1
  # ══════════════════════════════════════════════════════════════════════════
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    needs: gitleaks
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # DETECT PROJECT LANGUAGES
      - name: Check for project languages
        id: detect_lang
        run: |
         # Check for Python files or requirements
          if [ -f "requirements.txt" ] || [ -f "pyproject.toml" ] || [ -f "setup.py" ] || [ -n "$(find . -name "*.py" -maxdepth 2 -print -quit)" ]; then
            echo "has_python=true" >> $GITHUB_OUTPUT
          else
            echo "has_python=false" >> $GITHUB_OUTPUT
            echo "No Python configuration or files found."
          fi
          # Check for Node.js files
          if [ -f "package.json" ]; then
            echo "has_node=true" >> $GITHUB_OUTPUT
          else
            echo "has_node=false" >> $GITHUB_OUTPUT
            echo "No package.json found."
          fi

      # PYTHON STEPS (Runs only if Python is detected)
      - name: Set up Python
        if: steps.detect_lang.outputs.has_python == 'true'
        uses: actions/setup-python@v5
        with:
         python-version: '3.11'
         cache: 'pip'

      - name: Install Python dependencies
        if: steps.detect_lang.outputs.has_python == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Python linter (flake8)
        if: steps.detect_lang.outputs.has_python == 'true'
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run Python tests (pytest)
        if: steps.detect_lang.outputs.has_python == 'true'
        run: |
          # Only run pytest if a tests directory or test files exist to prevent empty suite failures
          if [ -d "tests" ] || [ -n "$(find . -name "test_*.py" -print -quit)" ]; then
            pytest
          else
             echo "No Python tests found, skipping..."
          fi

      # NODE.JS STEPS (Runs only if Node.js is detected)
      - name: Set up Node.js
        if: steps.detect_lang.outputs.has_node == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

       # 3. Use 'npm install' instead of 'npm ci' if package-lock.json is missing
      - name: Install dependencies
        if: steps.detect_lang.outputs.has_node == 'true'
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci
          else
            npm install
          fi
        # 4. Only run linter if package.json exists
      - name: Run linter
        if: steps.detect_lang.outputs.has_node == 'true'
        run: |
          if npm run | grep -q "lint"; then
            npm run lint
          else
            echo "No lint script found, skipping..."
          fi
        # 5. Only run tests if package.json exists
      - name: Run tests
        if: steps.detect_lang.outputs.has_node == 'true'
        run: |
          if npm run | grep -q "test"; then
            npm test
          else
            echo "No test script found, skipping..."
          fi

  # ══════════════════════════════════════════════════════════════════════════
  # Build + Gates 4 & 5 + ECR push
  # Waits for ALL four jobs above before starting.
  # The composite action handles Gate 4 (Trivy image), Gate 5 (Syft), and push.
  # ══════════════════════════════════════════════════════════════════════════
  build-and-push:
    name: "Build, scan (Gates 4–5), and push to ECR"
    runs-on: ubuntu-latest
    needs: [gitleaks, trivy-fs, lint-and-test]
    outputs:
      image-uri: ${{ steps.docker.outputs.image-uri }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build image, scan, generate SBOM, push to ECR
        id: docker
        uses: khadree/devops-platform-ci/.github/actions/docker-build-push@main
        with:
          service-name: ${{ inputs.service-name }}
          aws-region: ${{ secrets.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          trivy-severity: ${{ inputs.trivy-severity }}

 
  # Deploy to EKS — uncomment when self-hosted runners are ready
  # ══════════════════════════════════════════════════════════════════════════
  # deploy:
  #   name: Deploy to EKS
  #   runs-on: ubuntu-latest
  #   needs: build-and-push
  #   if: ${{ inputs.deploy == true && github.ref == 'refs/heads/main' }}
  #   steps:
  #     - name: Checkout code
  #       uses: actions/checkout@v4
  #     - name: Configure AWS credentials
  #       uses: aws-actions/configure-aws-credentials@v4
  #       with:
  #         aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
  #         aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  #         aws-region: ${{ secrets.AWS_REGION }}
  #     - name: Authenticate to EKS
  #       run: |
  #         aws eks update-kubeconfig \
  #           --region "${{ secrets.AWS_REGION }}" \
  #           --name "${{ secrets.EKS_CLUSTER_NAME }}"
  #     - name: Substitute image tag in manifest
  #       env:
  #         IMAGE_URI: ${{ needs.build-and-push.outputs.image-uri }}
  #       run: |
  #         sed -i "s|{{IMAGE_TAG}}|${IMAGE_URI}|g" k8s/deployment.yml
  #         grep "image:" k8s/deployment.yml
  #     - name: Apply Kubernetes manifests
  #       run: |
